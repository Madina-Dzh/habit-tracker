<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>habit-tracker</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="app">
        <div class="wrapper">
            <h1>Трекер привычек</h1>
            <span class="annotation">Отслеживай прогресс каждый день</span>
            <div class="form">
                <input id="valHabit_input" class="form-el"/>
                <select id="type_select" class="form-el">
                    <option value="once">Сделать 1 раз</option>
                    <option value="x">X раз в день</option>
                    <option value="n">N минут</option>
                </select>
                <input id="goal_input" type="number" placeholder="Значение X/N" class="form-el"/>
                <button id="addHabit_button">Добавить</button>
            </div>
            <section class="statistics">
                <h2>Статистика</h2>
                <p id="number-completed">Сегодня выполнено: [число]</p>
                <p id="seven-days-completed">Всего привычек: [число]</p>
                <p id="longest-streak">Лучший стрик: [число]</p>
            </section>
            <div id="habit-wrapper">
                Пока нет привычек - создай первую
            </div>
        </div>
        <div id="edit-modal"></div>
    </div>


    <script src="script.js">

    </script>
</body>

</html>
