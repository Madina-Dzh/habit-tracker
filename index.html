<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2">
    <title>habit-tracker</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <h1>Трекер привычек</h1>
        <span class="annotation">Отслеживай прогресс каждый день</span>
        <form>
            <input />
            <select>
                <option value="">Сделать 1 раз</option>
                <option value="">X раз в день</option>
                <option value="">N минут</option>
            </select>
            <input type="number" placeholder="Значение X/N" />
            <button>Добавить</button>
        </form>
        <section class="statistics">
            <h2>Статистика</h2>
            <p>Сегодня выполнено: [число]</p>
            <p>Всего привычек: [число]</p>
            <p>Лучший стрик: [число]</p>
        </section>
        <div class="habbit-wrapper">
            <!--Пока нет привычек - создай первую-->
            <div class="habbit-el">
                <span>Полить цветы вечером</span>
                <input type="checkbox" class="checkbox"/>
            </div>

                <span>Полить цветы вечером</span>
                <input type="checkbox" class="checkbox"/>
            </div>

                <input type="checkbox" class="checkbox"/>
            </div>

            </div>

                <span>Полить цветы вечером</span>
                <input type="checkbox" class="checkbox"/>
            </div>
        </div>

    </div>
</body>

</html>
