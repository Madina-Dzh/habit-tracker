<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">
    <title>Test editing modal window</title>
    <style>
        #edit-modal {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }
    </style>
</head>


<body>
    <div id="edit-modal">
        <label for="taskName">Название:</label>
        <input type="text" id="taskName" placeholder="Введите название">

        <label for="type_select">Тип:</label>
        <select id="type_select">
            <option value="once">Сделать 1 раз</option>
            <option value="x">X раз в день</option>
            <option value="n">N минут</option>
        </select>

        <label for="goal">Цель на день:</label>
        <input id="goal" type="number">

        <label for="MarkToday">Выполнено сегодня</label>
        <input id="goal" type="number">
        <!-- Или -->
        <label for="status">Статус задачи</label>
        <select id="type_select">
            <option value="once">Выполнено</option>
            <option value="x">Не выполнено</option>
        </select>

        <button>Закрыть</button>
        <button type="button" class="save-changes">Сохранить</button>
    </div>
</body>

</html>
